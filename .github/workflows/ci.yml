name: Github Actions Build Check

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Install, Generate, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
